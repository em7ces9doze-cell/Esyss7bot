name: EM7 Bot CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/em7-control-bridge"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm test
